}
.mini { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: -.01em; text-decoration: none; color: #FFFFFF; }
.mini b { font-weight: 800; }
.board {
  display: inline-block; max-width: 100%;
  background: var(--sign); color: var(--sign-ink);
  border-radius: 6px; padding: 12px 22px 12px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .55);
  position: relative; transform: rotate(-1.6deg); transform-origin: 20% 100%;
}
.board h1 {
  font-family: var(--font-display); font-weight: 800; color: var(--sign-red);
  font-size: clamp(48px, 14vw, 84px); line-height: .9; letter-spacing: -.04em;
  margin: 0;
}
.board h1 .small {
  display: block; font-size: .3em; font-weight: 600; letter-spacing: .02em;
  text-transform: uppercase; color: var(--sign-ink); margin-bottom: .45em;
}
.ch { display: inline-block; animation: pop .65s cubic-bezier(.2, 1.7, .4, 1) backwards; animation-delay: calc(var(--i) * 90ms + 150ms); }
@keyframes pop { from { opacity: 0; transform: translateY(22px) scale(.7) rotate(-8deg); } to { opacity: 1; transform: none; } }
.badge {
  position: absolute; top: -27px; right: -30px; width: 74px; height: 74px; border-radius: 50%;
  display: grid; place-content: center; text-align: center; transform: rotate(12deg);
  background: #FFC400; color: #1A0B0C; border: 2px dashed #1A0B0C; outline: 3px solid #FFC400;
  font-family: var(--font-display); font-weight: 800; font-size: 15px; line-height: 1.05; letter-spacing: .02em;
  text-transform: uppercase; animation: wobble 3.2s ease-in-out 1.2s infinite alternate;
}
@keyframes wobble { from { transform: rotate(8deg); } to { transform: rotate(16deg); } }
.rider {
  position: relative; display: block; width: max-content; margin: 10px 0 0 24px;
  background: #080304; color: #FFFFFF; border: 2px solid rgba(255, 255, 255, .85); border-radius: 4px;
  font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  padding: 7px 18px; transform-origin: 50% -16px;
  animation: swing 4.5s ease-in-out 1s 3 both;
}
.rider::before, .rider::after {
  content: ""; position: absolute; top: -16px; width: 2px; height: 16px; background: rgba(255, 255, 255, .85);
}
.rider::before { left: 16px; }
.rider::after { right: 16px; }
@keyframes swing { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(2.2deg); } 75% { transform: rotate(-2.2deg); } }
.hello { margin: 10px 0 0; max-width: 46ch; font-size: 17px; line-height: 1.4; }
.hello strong { font-family: var(--font-display); font-weight: 600; }
.hello, .rider { text-shadow: 0 1px 3px rgba(110, 0, 6, .55); }
.rider { text-shadow: none; }
.hello span { color: rgba(255, 255, 255, .96); }

/* Wide screens only: sign on the left, tag and greeting beside it, so the header is a slim strip. Phones keep the stacked layout above. */
@media (min-width: 760px) {
  .band { padding-top: calc(max(0px, env(safe-area-inset-top, 0px)) + 38px); padding-bottom: 16px; }
  .band::after {
    height: 96px;
    background-size: auto 44px, auto 28px, auto 18px;
    background-position: 0 100%, -150px calc(100% - 47px), -330px calc(100% - 78px);
  }
  .board { padding: 10px 18px 10px; }
  .board h1 { font-size: 72px; }
  .band-in.split { display: flex; align-items: center; gap: 22px; }
  .side { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
  .side .rider { margin: 0; }
  .rider::before, .rider::after { display: none; }
  .hello { margin: 0; font-size: 15px; line-height: 1.35; }
}

.search { display: block; }
.search input {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 14px 16px; -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--muted); }
input:focus-visible, a:focus-visible, button:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px;
}

.label { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.section { display: flex; flex-direction: column; }
.list { display: flex; flex-direction: column; gap: 10px; }

.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 38px 16px; padding-top: 14px; }
.folder {
  position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 0 10px 10px 10px;
  padding: 22px 18px 18px; text-decoration: none; color: var(--ink);
  transition: transform .15s ease, border-color .15s ease;
}
.folder { --c: var(--accent); }
.folder.c-red { --c: var(--red); } .folder.c-blue { --c: var(--blue); } .folder.c-green { --c: var(--green); }
.folder.c-amber { --c: var(--amber); } .folder.c-purple { --c: var(--purple); } .folder.c-teal { --c: var(--teal); }
.folder.c-pink { --c: var(--pink); } .folder.c-orange { --c: var(--orange); } .folder.c-indigo { --c: var(--indigo); }
.cat-head { --c: var(--accent); }
.cat-head.c-red { --c: var(--red); } .cat-head.c-blue { --c: var(--blue); } .cat-head.c-green { --c: var(--green); }
.cat-head.c-amber { --c: var(--amber); } .cat-head.c-purple { --c: var(--purple); } .cat-head.c-teal { --c: var(--teal); }
.cat-head.c-pink { --c: var(--pink); } .cat-head.c-orange { --c: var(--orange); } .cat-head.c-indigo { --c: var(--indigo); }
.folder:hover { border-color: var(--c); transform: translateY(-3px); }
.folder .tab {
  position: absolute; left: -1px; top: -25px; height: 25px;
  background: var(--surface); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 8px 8px 0 0; padding: 3px 12px; font-size: 12px; font-weight: 600; color: var(--muted);
}
.folder:hover .tab { border-color: var(--c); }
.folder h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.2; margin: 0; }
.icon { display: inline-flex; width: 46px; height: 46px; padding: 10px; border-radius: 13px; color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 15%, transparent); }
.icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.folder .icon { margin-bottom: 6px; }
.cat-head h2 { display: flex; align-items: center; gap: 10px; }
.cat-head .icon { flex: none; }
.folder p { margin: 0; font-size: 14px; color: var(--muted); }
.folder .go { margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--accent-text); }

.row {
  min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 15px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  color: var(--ink); text-decoration: none; transition: transform .15s ease, border-color .15s ease;
}
.row:hover { border-color: var(--accent); transform: translateX(4px); }
.row .text { min-width: 0; display: flex; flex-direction: column; }
.row .title { font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1.25; overflow-wrap: anywhere; }
.row .sub { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.row .meta { font-size: 12px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.row .arrow { flex: none; font-size: 20px; color: var(--accent-text); transition: transform .15s ease; }
.row:hover .arrow { transform: translate(2px, -2px); }
.row.pending { border-style: dashed; background: transparent; cursor: default; }
.row.pending .title { color: var(--muted); }
.row.pending:hover { transform: none; border-color: var(--line); }
.row.feature { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 20px 22px; }
.row.feature:hover { border-color: var(--ink); }
.row.feature .title { font-size: 22px; }
.row.feature .sub, .row.feature .meta, .row.feature .arrow { color: var(--accent-ink); }
.row.feature .sub { opacity: .92; }
.row.feature .meta { opacity: .8; }
.row.feature .arrow { font-size: 26px; }
.row.feature .pill { color: var(--accent-ink); border-color: var(--accent-ink); }
.pill {
  display: inline-block; align-self: flex-start; font-size: 11px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
  padding: 1px 8px; margin-bottom: 4px;
}

.back { display: inline-block; font-size: 14px; font-weight: 600; text-decoration: none; color: var(--accent-text); }
.back:hover { text-decoration: underline; }
.cat-head h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 8vw, 48px); line-height: 1; letter-spacing: -.03em; margin: 8px 0 8px; }
.cat-head p { margin: 0; color: var(--muted); max-width: 52ch; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 22px 18px; color: var(--muted); }

footer a { text-decoration: underline; }
footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }

@media (prefers-reduced-motion: reduce) {
  .folder, .row, .row .arrow { transition: none; }
  .folder:hover, .row:hover, .row:hover .arrow { transform: none; }
  .rider, .badge, .ch, .band::before { animation: none; }
}
</style>

<body>
<header class="band" id="band">
  <div class="band-in">
    <div class="board"><h1><span class="small">All Things</span>MC94</h1></div>
  </div>
</header>
<main class="page" id="app">
  <div id="view" aria-live="polite"><div class="empty">Unlocking the door...</div></div>
</main>
<noscript>This site needs JavaScript turned on to show the resource list.</noscript>
<script>
(function () {
  var view = document.getElementById('view');
  var state = { categories: [], resources: [] };
  var q = '';

  // Simple stroke icons, picked per category with the "icon" field in resources.json.
  var ICONS = {
    folder: '<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
    file: '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M10 12h5M10 16h5"/>',
    calendar: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    cap: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/>',
    megaphone: '<path d="M4 10v4h3l8 4V6l-8 4z"/><path d="M18 9a4 4 0 010 6"/>',
    laptop: '<rect x="5" y="6" width="14" height="10" rx="1.5"/><path d="M3 19h18"/>',
    target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',
    flag: '<path d="M6 21V4M6 5h11l-2 4 2 4H6"/>',
    key: '<circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21M17 12v3M20 12v2"/>',
    dollar: '<circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.5-.8-1.4-1.2-2.5-1.2-1.4 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2c-1.1 0-2-.4-2.5-1.2M12 6.5V8M12 16v1.5"/>',
    play: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/>',
    house: '<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-6h4v6"/>',
    palette: '<path d="M12 3a9 9 0 100 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 004-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',
    users: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.5 2 4.5 4.5"/>'
  };
  function icon(name) {
    var span = document.createElement('span');
    span.className = 'icon';
    span.setAttribute('aria-hidden', 'true');
    span.innerHTML = '<svg viewBox="0 0 24 24">' + (ICONS[name] || ICONS.folder) + '</svg>';
    return span;
  }

  var TAGLINES = [
    'Pick a folder. Close a deal.',
    'Less hunting, more handshakes.',
    'Find it fast, then go sell something.',
    'Every great closing starts with the right link.',
    'The listing is yours. The resources are ours.'
  ];
  function greeting() {
    var hr = new Date().getHours();
    return hr < 12 ? 'Good morning' : (hr < 17 ? 'Good afternoon' : 'Good evening');
  }
  var tagline = TAGLINES[Math.floor(Math.random() * TAGLINES.length)];

  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v);
      }
    }
    function add(c) {
      if (c == null || c === false) return;
      if (Array.isArray(c)) { c.forEach(add); return; }
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    for (var i = 2; i < arguments.length; i++) add(arguments[i]);
    return el;
  }
  function safeUrl(u) {
    try { var x = new URL(u); if (x.protocol === 'http:' || x.protocol === 'https:') return x.href; } catch (e) {}
    return '#';
  }
  function domain(u) {
    try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
  }
  function inCat(r, id) {
    return r.cat === id || (r.also || []).indexOf(id) !== -1;
  }
  function catById(id) {
    for (var i = 0; i < state.categories.length; i++) if (state.categories[i].id === id) return state.categories[i];
    return null;
  }
  function currentCat() {
    var m = /^#c-([a-z0-9-]+)$/.exec(location.hash || '');
    return m ? catById(m[1]) : null;
  }

  function rowFor(r, showCat, big) {
    var c = catById(r.cat);
    if (!r.url) {
      return h('div', { class: 'row pending' },
        h('span', { class: 'text' },
          h('span', { class: 'pill', text: 'Link coming soon' }),
          h('span', { class: 'title', text: r.title }),
          r.note ? h('span', { class: 'sub', text: r.note }) : null));
    }
    return h('a', { class: 'row' + (big ? ' feature' : ''), href: safeUrl(r.url), target: '_blank', rel: 'noopener' },
      h('span', { class: 'text' },
        r.example ? h('span', { class: 'pill', text: 'Example' }) : (r.new ? h('span', { class: 'pill', text: 'New' }) : null),
        h('span', { class: 'title', text: r.title }),
        r.note ? h('span', { class: 'sub', text: r.note }) : null,
        h('span', { class: 'meta', text: domain(r.url) + (showCat && c ? ' · ' + c.name : '') })),
      h('span', { class: 'arrow', 'aria-hidden': 'true', text: '↗' }));
  }

  function homeView() {
    var box = h('div', { class: 'wrap' });
    var featured = state.resources.filter(function (r) { return r.featured; });
    var pinned = state.resources.filter(function (r) { return r.pin && !r.featured; });
    if (featured.length) {
      box.appendChild(h('section', { class: 'section' },
        h('h2', { class: 'label', text: 'Just added' }),
        h('div', { class: 'list' }, featured.map(function (r) { return rowFor(r, true, true); }))));
    }
    if (pinned.length) {
      box.appendChild(h('section', { class: 'section' },
        h('h2', { class: 'label', text: 'Start here' }),
        h('div', { class: 'list' }, pinned.map(function (r) { return rowFor(r, true); }))));
    }
    box.appendChild(h('section', { class: 'section' },
      h('h2', { class: 'label', text: 'Browse by topic' }),
      h('div', { class: 'folders' }, state.categories.map(function (c) {
        var n = state.resources.filter(function (r) { return inCat(r, c.id); }).length;
        return h('a', { class: 'folder' + (c.color ? ' c-' + c.color : ''), href: '#c-' + c.id },
          h('span', { class: 'tab', text: n + (n === 1 ? ' link' : ' links') }),
          icon(c.icon),
          h('h2', { text: c.name }),
          c.desc ? h('p', { text: c.desc }) : null,
          h('span', { class: 'go', text: 'Open the folder →' }));
      }))));
    return box;
  }

  function catView(c) {
    var items = state.resources.filter(function (r) { return inCat(r, c.id); });
    return h('div', { class: 'wrap', style: 'gap:22px' },
      h('div', { class: 'cat-head' + (c.color ? ' c-' + c.color : '') },
        h('a', { class: 'back', href: '#' }, '← Back to all folders'),
        h('h2', null, icon(c.icon), ' ', c.name),
        c.desc ? h('p', { text: c.desc }) : null),
      items.length
        ? h('div', { class: 'list' }, items.map(function (r) { return rowFor(r, false); }))
        : h('div', { class: 'empty', text: 'Nothing here yet. New resources show up as soon as they are added.' }));
  }

  function searchView(query) {
    var t = query.toLowerCase();
    var hits = state.resources.filter(function (r) {
      var c = catById(r.cat);
      return (r.title + ' ' + (r.note || '') + ' ' + r.url + ' ' + (c ? c.name : '')).toLowerCase().indexOf(t) !== -1;
    });
    return h('section', { class: 'section' },
      h('h2', { class: 'label', text: hits.length + (hits.length === 1 ? ' result' : ' results') + ' for “' + query + '”' }),
      hits.length
        ? h('div', { class: 'list' }, hits.map(function (r) { return rowFor(r, true); }))
        : h('div', { class: 'empty', text: 'No matches. Even the best agents lose a key sometimes. Try a shorter word, or browse the folders.' }));
  }

  function renderContent() {
    var box = document.getElementById('content');
    box.textContent = '';
    var query = q.trim();
    var c = currentCat();
    box.appendChild(query ? searchView(query) : (c ? catView(c) : homeView()));
  }

  function renderBand(c) {
    var band = document.getElementById('band');
    band.className = 'band' + (c ? ' compact' : '');
    band.textContent = '';
    band.appendChild(h('div', { class: 'band-in' + (c ? '' : ' split') }, c
      ? h('a', { class: 'mini', href: '#' }, 'All Things ', h('b', { text: 'MC94' }))
      : [
          h('div', { class: 'board' },
            h('h1', { 'aria-label': 'All Things MC94' },
              h('span', { class: 'small', 'aria-hidden': 'true', text: 'All Things' }),
              ['M', 'C', '9', '4'].map(function (ch, i) { return h('span', { class: 'ch', 'aria-hidden': 'true', style: '--i:' + i, text: ch }); })),
            h('span', { class: 'badge', 'aria-hidden': 'true' }, 'Open', h('br'), 'house')),
          h('div', { class: 'side' },
            h('span', { class: 'rider', text: 'Agent resources' }),
            h('p', { class: 'hello' }, h('strong', { text: greeting() + ', agents. ' }), h('span', { text: tagline })))
        ]));
  }

  function render() {
    var c = currentCat();
    renderBand(c);
    view.textContent = '';
    view.appendChild(h('div', { class: 'wrap' },
      h('label', { class: 'search' },
        h('input', { type: 'search', id: 'q', placeholder: 'Search forms, classes, tools', 'aria-label': 'Search every resource', autocomplete: 'off', value: q,
          oninput: function (e) { q = e.target.value; renderContent(); } })),
      h('div', { id: 'content' }),
      h('footer', null,
        'Missing a link you need? Email ',
        h('a', { href: 'mailto:frontdesk94@kw.com', text: 'frontdesk94@kw.com' }),
        ' or ask in the ',
        h('a', { href: 'https://www.facebook.com/groups/kwrsnorthshore/', target: '_blank', rel: 'noopener', text: 'Facebook group' }),
        '. Each office is independently owned and operated. Equal Housing Opportunity.')));
    renderContent();
  }

  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });

  fetch('resources.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('bad status'); return r.json(); })
    .then(function (d) {
      state.categories = d.categories || [];
      state.resources = d.resources || [];
      render();
    })
    .catch(function () {
      view.textContent = '';
      view.appendChild(h('div', { class: 'empty', text: 'The resource list could not be loaded. Refresh the page, or email allthingsmc94@kw.com.' }));
    });
})();
</script>
